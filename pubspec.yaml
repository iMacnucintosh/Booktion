name: booktion
description: "App de gestión de libros conectada a Notion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management + DI
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Network
  dio: ^5.4.0

  # Functional Programming
  fpdart: ^1.1.0

  # Inmutabilidad
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Navigation
  go_router: ^13.0.0

  # Utils
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/booktion.png"
    background_color: "#FFFFFF"
    theme_color: "#6366F1"
  windows:
    generate: true
    image_path: "assets/icon/booktion.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/booktion.png"
  image_path: "assets/icon/booktion.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/booktion.png"

flutter:
  uses-material-design: true
  
  # Note: Create a .env file in the root directory with:
  # NOTION_API_KEY=your_api_key
  # NOTION_DATABASE_ID=your_database_id
  # 
  # The .env file is loaded at runtime, not as a Flutter asset
